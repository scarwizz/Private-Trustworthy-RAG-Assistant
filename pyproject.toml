# pyproject.toml

[project]
name = "tai"
version = "0.1.0"
description = "A local, trustworthy RAG-based AI assistant."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]

dependencies = [
    # Core ML/RAG Libraries
    "torch",
    "transformers",
    "accelerate",
    "langchain",
    "langchain-community",
    "sentence-transformers",
    # Vector Database & Document Loader
    "chromadb", # Local Vector Database (FAISS is an alternative)
    "pypdf", # For loading PDF documents
    # Utility & Frontend
    "huggingface-hub",
    "tqdm",
    "streamlit",
    "pdfplumber>=0.11.7",
    # Backend API (FastAPI)
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "python-multipart>=0.0.32",
]

[project.urls]
Homepage = "https://github.com/your-org/private-trustworthy-rag-assistant"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
